<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fluxy - Redefinir senha</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="styles/auth.css" />

  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png" />
    <link rel="manifest" href="assets/favicon/site.webmanifest" />
    <link rel="shortcut icon" href="assets/favicon/favicon.ico" />
    <meta name="theme-color" content="#0b1220" />

</head>

<body>
  <main class="auth-page">
    <section class="auth-shell">

      <aside class="auth-brand">
        <img src="assets/logo.png" alt="Fluxy" class="auth-logo" />

        <h1>Crie uma nova senha.</h1>
        <p>
          Escolha uma senha segura para voltar a acessar seu painel Fluxy.
        </p>

        <div class="brand-list">
          <span><i class="fa-solid fa-check"></i> Senha criptografada</span>
          <span><i class="fa-solid fa-check"></i> Link com validade</span>
          <span><i class="fa-solid fa-check"></i> Acesso protegido</span>
        </div>

        <a href="auth.html" class="back-link">Voltar para Login</a>
      </aside>

      <section class="auth-card single-auth-card">
        <form id="reset-form" class="form" novalidate>
          <h2>Redefinir senha</h2>
          <p class="form-subtitle">
            Digite e confirme sua nova senha.
          </p>

          <label for="reset-password">Nova senha</label>
          <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input id="reset-password" name="password" type="password" autocomplete="new-password" required />

            <button type="button" class="toggle-password" data-target="reset-password" aria-label="Mostrar senha">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>

          <label for="reset-confirm">Confirmar nova senha</label>
          <div class="input-group">
            <i class="fa-solid fa-shield-heart"></i>
            <input id="reset-confirm" name="confirmPassword" type="password" autocomplete="new-password" required />

            <button type="button" class="toggle-password" data-target="reset-confirm" aria-label="Mostrar senha">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>

          <button type="submit" class="btn">Salvar nova senha</button>

          <div class="auth-extra-actions center">
            <a href="forgot-password.html">Solicitar novo link</a>
          </div>
        </form>

        <div id="auth-message" class="message" hidden></div>
      </section>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
