<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fluxy - Estoque</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="styles/dashboard.css" />
  <link rel="stylesheet" href="styles/estoque.css" />
</head>
<body>
  <aside class="sidebar">
    <div>
      <img src="assets/logo.png" alt="Fluxy" class="logo" />

      <nav>
        <a href="dashboard.html">
          <i data-lucide="layout-dashboard" class="nav-icon"></i>
          <span class="nav-text">Dashboard</span>
        </a>

        <a href="#">
          <i data-lucide="shopping-cart" class="nav-icon"></i>
          <span class="nav-text">Vendas</span>
        </a>

        <a class="active" href="estoque.html">
          <i data-lucide="package" class="nav-icon"></i>
          <span class="nav-text">Estoque</span>
        </a>

        <a href="#">
          <i data-lucide="bar-chart-3" class="nav-icon"></i>
          <span class="nav-text">Relatórios</span>
        </a>

        <a href="perfil.html">
          <i data-lucide="user-round-cog" class="nav-icon"></i>
          <span class="nav-text">Perfil</span>
        </a>
      </nav>
    </div>

    <button class="logout-btn" onclick="sair()">
      <i data-lucide="log-out" class="logout-icon"></i>
      <span class="logout-text">Sair</span>
    </button>
  </aside>

  <main class="dashboard">
    <header class="topbar">
      <div>
        <h1>Estoque</h1>
        <p>Cadastre e acompanhe os produtos do seu negócio.</p>
      </div>

      <button id="toggle-theme" class="theme-btn" type="button">🌙</button>
    </header>

    <section class="panel">
      <h2>Novo produto</h2>

      <form id="form-produto">
        <label for="nome">Nome do produto</label>
        <input id="nome" type="text" placeholder="Ex: Camiseta" required />

        <label for="preco">Preço</label>
        <input id="preco" type="number" step="0.01" placeholder="Ex: 59.90" required />

        <label for="estoque">Quantidade em estoque</label>
        <input id="estoque" type="number" placeholder="Ex: 20" required />

        <label for="minimo">Estoque mínimo</label>
        <input id="minimo" type="number" placeholder="Ex: 5" />

        <button type="submit">Salvar produto</button>
      </form>
    </section>

    <section class="panel">
      <h2>Produtos</h2>
      <div id="lista-produtos"></div>
    </section>
  </main>

  <script src="js/estoque.js"></script>
</body>
</html>
