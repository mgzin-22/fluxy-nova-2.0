<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fluxy - Recuperar senha</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="styles/auth.css" />
</head>

<body>
  <main class="auth-page">
    <section class="auth-shell">

      <aside class="auth-brand">
        <img src="assets/logo.png" alt="Fluxy" class="auth-logo" />

        <h1>Recupere o acesso à sua conta.</h1>
        <p>
          Informe o e-mail cadastrado e enviaremos um link seguro para redefinir sua senha.
        </p>

        <div class="brand-list">
          <span><i class="fa-solid fa-check"></i> Link temporário</span>
          <span><i class="fa-solid fa-check"></i> Envio para e-mail cadastrado</span>
          <span><i class="fa-solid fa-check"></i> Nova senha protegida</span>
        </div>

        <a href="auth.html" class="back-link">Voltar para Login</a>
      </aside>

      <section class="auth-card single-auth-card">
        <form id="forgot-form" class="form" novalidate>
          <h2>Esqueci minha senha</h2>
          <p class="form-subtitle">
            Digite o e-mail da sua conta Fluxy.
          </p>

          <label for="forgot-email">E-mail cadastrado</label>
          <div class="input-group">
            <i class="fa-solid fa-envelope"></i>
            <input id="forgot-email" name="email" type="email" autocomplete="email" required />
          </div>

          <button type="submit" class="btn">Enviar link de recuperação</button>

          <div class="auth-extra-actions center">
            <a href="auth.html">Lembrei minha senha</a>
          </div>
        </form>

        <div id="auth-message" class="message" hidden></div>
      </section>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
